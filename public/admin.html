<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WinCash Admin</title><style>body{font:16px Arial;background:#f3f5f9;color:#172033;margin:0}header{background:#14213d;color:white;padding:18px}main{max-width:900px;margin:24px auto;padding:12px}.box{background:white;border:1px solid #ddd;border-radius:10px;padding:18px;margin:12px 0}input{padding:12px;width:95%;margin:7px 0}button{padding:11px 15px;background:#14213d;color:white;border:0;border-radius:7px}table{width:100%;border-collapse:collapse}td,th{text-align:left;border-bottom:1px solid #ddd;padding:8px}</style></head><body><header><h1>WinCash — Administration</h1><p>Portail privé</p></header><main><section id="login" class="box"><h2>Connexion administrateur</h2><form onsubmit="login(event)"><input name="email" type="email" placeholder="E-mail administrateur" required><input name="password" type="password" placeholder="Mot de passe" required><button>Se connecter</button></form></section><section id="panel" class="box" hidden><h2>Tableau de bord</h2><div id="data">Chargement…</div><button onclick="logout()">Déconnexion</button></section></main><script>async function api(p,o={}){let r=await fetch('/api'+p,{credentials:'same-origin',headers:{'Content-Type':'application/json'},...o}),d=await r.json();if(!r.ok)throw Error(d.error||'Erreur');return d}async function login(e){e.preventDefault();try{await api('/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await load()}catch(x){alert(x.message)}}async function load(){try{let me=(await api('/me')).user;if(!me||!(me.roles||[me.role]).includes('admin'))throw Error('Accès administrateur requis');let d=await api('/admin/overview');document.querySelector('#login').hidden=true;document.querySelector('#panel').hidden=false;document.querySelector('#data').innerHTML=`<p>Produits : ${d.products}</p><h3>Utilisateurs par rôle</h3>${d.users.map(u=>`<p>${u.role} : ${u.count}</p>`).join('')}<h3>Commandes</h3>${d.orders.map(o=>`<p>${o.status} : ${o.count} commandes — ${o.total} Kz</p>`).join('')}<h3>Retraits</h3>${d.withdrawals.map(w=>`<p>${w.affiliate_name} — ${w.amount} Kz — ${w.status}</p>`).join('')}`;}catch(e){document.querySelector('#login').hidden=false;document.querySelector('#panel').hidden=true;}}async function logout(){await api('/logout',{method:'POST'});location.reload()}load();</script></body></html>

<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#14213d"><link rel="manifest" href="/manifest.json"><title>WinCash</title><style>
:root{--n:#14213d;--g:#fca311;--bg:#f4f6fa;--line:#e1e6ef}*{box-sizing:border-box}body{margin:0;font:16px Arial;background:var(--bg);color:#172033}header{background:var(--n);color:white;padding:16px 5%;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}header h1{margin:0;color:var(--g)}main{max-width:1100px;margin:22px auto;padding:0 14px}.tabs,.row,.bar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.tabs{margin:16px 0}button{border:0;border-radius:8px;padding:11px 15px;background:var(--n);color:white;font-weight:bold;cursor:pointer}button.gold{background:var(--g);color:#171717}button.alt{background:#e8edf5;color:var(--n)}input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;font:inherit;background:white}label{display:block;font-size:13px;font-weight:bold;margin:10px 0 5px}.panel,.card{background:white;border:1px solid var(--line);border-radius:12px;padding:16px;margin:12px 0}.form{max-width:550px;margin:20px auto}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}.card img{width:100%;height:155px;object-fit:cover;border-radius:8px}.price{font-size:20px;color:#087044;font-weight:bold}.muted{color:#657087;font-size:13px}.hidden{display:none!important}.row>*{flex:1;min-width:150px}.notice{padding:12px;background:#fff4d6;border-radius:8px;margin:12px 0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px;border-bottom:1px solid var(--line);font-size:13px}#toast{position:fixed;bottom:15px;left:5%;right:5%;background:var(--n);color:white;padding:13px;border-radius:8px;display:none;z-index:9}.linkbox{overflow-wrap:anywhere;background:#f0f3f8;padding:9px;border-radius:7px;font-size:13px}@media(max-width:600px){.row{display:block}}
</style></head><body><header><div><h1>WinCash</h1><small>Vendez • Recommandez • Gagnez</small></div><div id="account">Bienvenue</div></header><main><div id="toast"></div><nav class="tabs"><button class="alt" onclick="show('shop')">Boutique</button><button class="alt" onclick="show('login')">Connexion</button><button class="alt" onclick="show('register')">Créer un compte</button><button id="dashTab" class="alt hidden" onclick="dashboard()">Mon espace</button></nav>
<section id="shop"><div class="bar" style="justify-content:space-between"><h2>Produits disponibles</h2><input id="search" placeholder="Rechercher…" style="max-width:260px" oninput="renderProducts()"></div><p class="muted">Paiement en espèces à la livraison ou au retrait.</p><div id="products" class="grid"></div></section>
<section id="login" class="panel form hidden"><h2>Connexion</h2><form onsubmit="login(event)"><label>E-mail</label><input name="email" type="email" required><label>Mot de passe</label><input name="password" type="password" required><p><button>Se connecter</button></p></form></section>
<section id="register" class="panel form hidden"><h2>Créer un compte</h2><form onsubmit="register(event)"><label>Nom complet</label><input name="name" required><label>E-mail</label><input name="email" type="email" required><label>Téléphone</label><input name="phone" required><label>Mot de passe (8 caractères minimum)</label><input name="password" type="password" minlength="8" required><label>Type de compte</label><select name="role"><option value="customer">Client</option><option value="seller">Vendeur</option><option value="affiliate">Affilié</option></select><p><button class="gold">Créer mon compte</button></p></form></section>
<section id="dashboard" class="hidden"><div class="bar" style="justify-content:space-between"><h2 id="dashTitle">Mon espace</h2><button class="alt" onclick="logout()">Déconnexion</button></div><div id="dashContent"></div></section>
<section id="checkout" class="panel form hidden"><h2>Finaliser la commande</h2><div id="checkoutProduct"></div><form onsubmit="placeOrder(event)"><input type="hidden" name="product_id"><input type="hidden" name="affiliate_id"><label>Nom du destinataire</label><input name="customer_name" required><label>Téléphone</label><input name="customer_phone" required><label>Adresse ou lieu de retrait</label><textarea name="address" required></textarea><label>Réception</label><select name="delivery_method"><option value="delivery">Livraison à domicile</option><option value="pickup">Retrait sur place</option></select><div class="notice">Paiement en espèces au vendeur à la réception ou au retrait.</div><button class="gold">Confirmer la commande</button> <button type="button" class="alt" onclick="show('shop')">Annuler</button></form></section></main><footer style="text-align:center;padding:25px;color:#657087;font-size:12px">WinCash — Paiement en espèces au lancement.</footer>
<script>
let me=null,products=[],ref=new URLSearchParams(location.search).get('ref'),queryProduct=new URLSearchParams(location.search).get('product');const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opts={}){let r=await fetch('/api'+url,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erreur.');return d}function toast(t){let x=$('#toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',4500)}function show(id){['shop','login','register','dashboard','checkout'].forEach(x=>$('#'+x).classList.toggle('hidden',x!==id));scrollTo(0,0)}
async function boot(){try{me=(await api('/me')).user;$('#account').textContent=me?me.name+' · '+me.role:'Bienvenue';$('#dashTab').classList.toggle('hidden',!me);products=(await api('/products')).products;renderProducts();if(queryProduct){let p=products.find(x=>String(x.id)===queryProduct);if(p&&me?.role==='customer')checkout(p)}}catch(e){toast(e.message)}}
function renderProducts(){let t=($('#search')?.value||'').toLowerCase(),list=products.filter(p=>(p.title+' '+p.description+' '+p.category).toLowerCase().includes(t));$('#products').innerHTML=list.length?list.map(p=>`<article class="card">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.title)}">`:'<div style="height:155px;display:grid;place-items:center;background:#eef1f6">WinCash</div>'}<h3>${esc(p.title)}</h3><p>${esc(p.description)}</p><div class="price">${Number(p.price).toLocaleString('fr-FR')} Kz</div><p class="muted">Stock : ${p.stock} · Vendeur : ${esc(p.seller_name)}<br>Livraison : ${p.delivery_fee} Kz</p><button class="gold" onclick="checkoutById(${p.id})">Commander</button></article>`).join(''):'<p>Aucun produit disponible pour le moment.</p>'}
function checkoutById(id){let p=products.find(x=>Number(x.id)===id);if(p)checkout(p)}function checkout(p){if(!me){toast('Connectez-vous avec un compte client.');show('login');return}if(me.role!=='customer'){toast('La commande est réservée aux comptes clients.');return}$('#checkoutProduct').textContent=p.title+' — '+p.price+' Kz';let f=$('#checkout form');f.product_id.value=p.id;f.affiliate_id.value=ref&&Number(ref)!==me.id?ref:'';show('checkout')}
async function placeOrder(e){e.preventDefault();let b=Object.fromEntries(new FormData(e.target));b.product_id=Number(b.product_id);b.affiliate_id=b.affiliate_id?Number(b.affiliate_id):null;b.quantity=1;try{let d=await api('/orders',{method:'POST',body:JSON.stringify(b)});toast('Commande enregistrée : '+d.order.order_code);show('shop')}catch(x){toast(x.message)}}async function login(e){e.preventDefault();try{await api('/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await boot();dashboard()}catch(x){toast(x.message)}}async function register(e){e.preventDefault();try{await api('/register',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});await boot();dashboard()}catch(x){toast(x.message)}}async function logout(){await api('/logout',{method:'POST'});me=null;ref=null;await boot();show('shop')}
function statusLabel(s){return({new:'Nouvelle',accepted:'Acceptée',preparing:'En préparation',ready:'Prête',shipped:'Expédiée',delivered:'Livrée',cancelled:'Annulée',unpaid:'Non payé',paid:'Payé',pending:'En attente',available:'Disponible',requested:'Demandé',approved:'Approuvé',rejected:'Refusé'})[s]||s}
async function dashboard(){if(!me)return show('login');show('dashboard');$('#dashTitle').textContent='Espace '+me.role;let box=$('#dashContent');box.innerHTML='Chargement…';try{if(me.role==='seller'){let [ps,os]=await Promise.all([api('/my/products'),api('/orders')]);box.innerHTML=`<div class="panel"><h3>Ajouter un produit</h3><form onsubmit="addProduct(event)"><label>Nom</label><input name="title" required><label>Description</label><textarea name="description"></textarea><div class="row"><div><label>Catégorie</label><input name="category"></div><div><label>Prix (Kz)</label><input name="price" type="number" min="1" required></div><div><label>Stock</label><input name="stock" type="number" min="0" required></div><div><label>Commission affilié par unité (Kz)</label><input name="commission" type="number" min="0" value="0"></div><div><label>Frais de livraison (Kz)</label><input name="delivery_fee" type="number" min="0" value="0"></div></div><label>Photo du produit (depuis votre téléphone)</label><input id="photo" type="file" accept="image/*"><div id="preview"></div><p><button class="gold">Publier le produit</button></p></form></div><div class="panel"><h3>Mes produits (${ps.products.length})</h3>${ps.products.map(p=>`<p><b>${esc(p.title)}</b> — ${p.price} Kz · stock ${p.stock}</p>`).join('')||'Aucun produit.'}</div>${ordersTable(os.orders,true)}`;$('#photo').onchange=previewPhoto;
}else if(me.role==='affiliate'){let [sum,os]=await Promise.all([api('/affiliate/summary'),api('/orders')]);let s=sum.summary;box.innerHTML=`<div class="grid"><div class="card">Commissions en attente<h2>${Number(s.pending).toLocaleString('fr-FR')} Kz</h2></div><div class="card">Disponibles<h2>${Number(s.available).toLocaleString('fr-FR')} Kz</h2></div><div class="card">Déjà payées<h2>${Number(s.paid).toLocaleString('fr-FR')} Kz</h2></div></div><div class="panel"><h3>Produits à promouvoir</h3><div id="affiliateProducts" class="grid">Chargement…</div></div><div class="panel"><h3>Demander un retrait manuel</h3><form onsubmit="withdraw(event)"><label>Montant disponible (Kz)</label><input name="amount" type="number" min="1" step=".01" required><label>Coordonnées de paiement</label><textarea name="payout_details" required></textarea><button>Envoyer la demande</button></form></div>${ordersTable(os.orders,false)}`;renderAffiliateProducts();
}else if(me.role==='customer'){let os=await api('/orders');box.innerHTML='<h3>Mes commandes</h3>'+ordersTable(os.orders,false)}else if(me.role==='admin'){let d=await api('/admin/overview'),os=await api('/orders');box.innerHTML=`<div class="grid"><div class="card">Produits<h2>${d.products}</h2></div><div class="card">Comptes<h2>${d.users.reduce((a,x)=>a+x.count,0)}</h2></div><div class="card">Commandes<h2>${d.orders.reduce((a,x)=>a+x.count,0)}</h2></div></div><div class="panel"><h3>Demandes de retrait</h3>${d.withdrawals.map(w=>`<p>${esc(w.affiliate_name)} — ${w.amount} Kz — ${esc(w.payout_details)} — ${statusLabel(w.status)} <button onclick="withdrawStatus(${w.id},'paid')">Marquer payé</button> <button class="alt" onclick="withdrawStatus(${w.id},'rejected')">Refuser</button></p>`).join('')||'Aucune demande.'}</div>${ordersTable(os.orders,true)}`}}catch(e){box.innerHTML='<div class="notice">'+esc(e.message)+'</div>'}}
function renderAffiliateProducts(){let box=$('#affiliateProducts');if(!box)return;box.innerHTML=products.length?products.map(p=>`<article class="card">${p.image_url?`<img src="${esc(p.image_url)}">`:''}<h3>${esc(p.title)}</h3><p>${Number(p.price).toLocaleString('fr-FR')} Kz</p><p class="muted">Votre commission : ${Number(p.commission).toLocaleString('fr-FR')} Kz par unité · Stock : ${p.stock}</p><button onclick="getAffiliateLink(${p.id})">Obtenir mon lien</button><div id="afflink-${p.id}"></div></article>`).join(''):'Aucun produit disponible.'}
async function getAffiliateLink(id){try{let d=await api('/affiliate/link/'+id),box=$('#afflink-'+id);box.innerHTML=`<p class="linkbox">${esc(d.link)}</p><button class="alt" onclick="copyText('${d.link}')">Copier le lien</button> <button class="gold" onclick="shareLink('${d.link}')">Partager</button>`}catch(e){toast(e.message)}}async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Lien copié.')}catch(e){toast('Copiez le lien affiché en le sélectionnant.')}}async function shareLink(t){if(navigator.share){try{await navigator.share({title:'WinCash',text:'Découvrez ce produit sur WinCash',url:t})}catch(e){}}else copyText(t)}
let photoData='';function previewPhoto(e){let f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('Choisissez une image.');let rd=new FileReader();rd.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,700/Math.max(im.width,im.height));c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);photoData=c.toDataURL('image/jpeg',.68);$('#preview').innerHTML=`<img src="${photoData}" style="max-width:180px;max-height:130px">`;};im.src=rd.result};rd.readAsDataURL(f)}
async function addProduct(e){e.preventDefault();let b=Object.fromEntries(new FormData(e.target));for(let k of ['price','stock','commission','delivery_fee'])b[k]=Number(b[k]||0);b.image_url=photoData;try{await api('/products',{method:'POST',body:JSON.stringify(b)});toast('Produit publié.');photoData='';dashboard()}catch(x){toast(x.message)}}
function ordersTable(list,actions){return `<div class="panel"><h3>Commandes</h3><div class="tablewrap"><table><tr><th>Référence</th><th>Produit</th><th>Total</th><th>Paiement</th><th>État</th><th>Action</th></tr>${list.map(o=>`<tr><td>${esc(o.order_code)}</td><td>${esc(o.product_title)}</td><td>${o.total} Kz</td><td>${statusLabel(o.payment_status)}</td><td>${statusLabel(o.status)}</td><td>${actions&&me.role!=='admin'&&o.payment_status!=='paid'?`<button onclick="confirmCash(${o.id})">Confirmer espèces</button>`:''}${actions&&o.status!=='delivered'&&o.status!=='cancelled'?`<select onchange="setStatus(${o.id},this.value)"><option value="">Changer état</option><option value="accepted">Acceptée</option><option value="preparing">En préparation</option><option value="ready">Prête</option><option value="shipped">Expédiée</option><option value="delivered">Livrée</option><option value="cancelled">Annulée</option></select>`:''}</td></tr>`).join('')||'<tr><td colspan="6">Aucune commande.</td></tr>'}</table></div></div>`}async function confirmCash(id){try{await api('/orders/'+id+'/confirm-cash',{method:'POST'});toast('Paiement confirmé.');dashboard()}catch(e){toast(e.message)}}async function setStatus(id,status){if(!status)return;try{await api('/orders/'+id+'/status',{method:'PATCH',body:JSON.stringify({status})});toast('Commande mise à jour.');dashboard()}catch(e){toast(e.message);dashboard()}}async function withdraw(e){e.preventDefault();try{let d=await api('/affiliate/withdraw',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});toast(d.message);dashboard()}catch(x){toast(x.message)}}async function withdrawStatus(id,status){try{await api('/admin/withdrawals/'+id,{method:'PATCH',body:JSON.stringify({status})});dashboard()}catch(e){toast(e.message)}}if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});boot();
</script></body></html>

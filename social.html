<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WinCash — Communauté</title><style>
:root{font-family:Arial,sans-serif;color:#18212f;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}.top{background:#123d32;color:white;padding:16px;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1100px;margin:20px auto;padding:0 12px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.tabs button,.btn{border:0;border-radius:9px;padding:11px 14px;background:#176b50;color:white;cursor:pointer}.tabs button{background:#dce9e3;color:#174b3b}.tabs button.active{background:#176b50;color:white}.grid{display:grid;grid-template-columns:300px 1fr;gap:14px}.card{background:white;border-radius:13px;padding:15px;margin-bottom:12px;box-shadow:0 2px 9px #142b3910}input,textarea,select{width:100%;padding:11px;border:1px solid #ccd5df;border-radius:8px;margin:6px 0 10px;font:inherit}textarea{min-height:85px}.muted{color:#687586;font-size:13px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.item{padding:10px;border-bottom:1px solid #edf0f3;cursor:pointer}.item:hover{background:#f2f7f4}.bubble{padding:10px;margin:8px 0;border-radius:12px;background:#eef3f7;max-width:85%}.mine{background:#d9f3e5;margin-left:auto}.hidden{display:none}.danger{color:#b42318}.attach{max-width:100%;max-height:180px}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style></head><body><header class="top"><b>WinCash · Communauté</b><a href="/" style="color:white">Retour à la boutique</a></header><main class="wrap"><nav class="tabs"><button class="active" data-tab="chat">Messages</button><button data-tab="feed">Publications</button><button data-tab="groups">Groupes</button><button data-tab="alerts">Notifications <span id="unread"></span></button></nav><div id="notice" class="card muted">Chargement…</div>
<section id="chat" class="grid"><div class="card"><h3>Membres</h3><input id="searchMember" placeholder="Rechercher un membre"><div id="members"></div></div><div class="card"><h3 id="chatTitle">Choisissez un membre</h3><div id="messages" style="min-height:260px;max-height:55vh;overflow:auto"></div><form id="sendForm"><textarea id="messageBody" placeholder="Écrire un message…" maxlength="5000"></textarea><input id="file" type="file" accept="image/png,image/jpeg,image/gif,image/webp,application/pdf,text/plain"><div class="muted" id="fileHint">Images, PDF ou fichier texte — 7 Mo maximum.</div><button class="btn">Envoyer</button></form></div></section>
<section id="feed" class="hidden"><div class="card"><h3>Créer une publication</h3><textarea id="postBody" placeholder="Que souhaitez-vous partager ?"></textarea><input id="postMedia" placeholder="Lien public d'une image ou vidéo (facultatif)"><button class="btn" id="publish">Publier</button></div><div id="posts"></div></section>
<section id="groups" class="hidden"><div class="card"><h3>Créer un groupe</h3><input id="groupName" placeholder="Nom du groupe"><textarea id="groupDesc" placeholder="Description"></textarea><select id="groupVisibility"><option value="public">Public</option><option value="private">Privé</option></select><button class="btn" id="createGroup">Créer le groupe</button></div><div id="groupList"></div></section>
<section id="alerts" class="hidden"><div class="card"><button class="btn" id="readAll">Tout marquer comme lu</button><div id="notifications"></div></div></section></main>
<script>
const $=id=>document.getElementById(id);let me=null,current=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opts={}){let r=await fetch('/api'+url,{credentials:'same-origin',...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Erreur');return d}function msg(t){$('notice').textContent=t;$('notice').classList.remove('hidden');setTimeout(()=>$('notice').classList.add('hidden'),3500)}
async function init(){try{let d=await api('/me');me=d.user;if(!me){location.href='/';return}await loadMembers();await loadPosts();await loadGroups();await loadNotifications();let chat=new URLSearchParams(location.search).get('chat');if(chat){let el=document.querySelector(`[data-id="${chat}"]`);if(el)el.click()}}catch(e){msg(e.message)}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));['chat','feed','groups','alerts'].forEach(x=>$(x).classList.toggle('hidden',x!==b.dataset.tab));});
async function loadMembers(){let d=await api('/members?q='+encodeURIComponent($('searchMember').value||''));$('members').innerHTML=d.members.map(m=>`<div class="item" data-id="${m.id}"><b>${esc(m.name)}</b><div class="muted">${esc(m.role)}</div></div>`).join('')||'<p class="muted">Aucun membre trouvé.</p>';document.querySelectorAll('#members [data-id]').forEach(el=>el.onclick=()=>openChat(el.dataset.id,el.querySelector('b').textContent))}
$('searchMember').oninput=()=>loadMembers().catch(e=>msg(e.message));async function openChat(id,name){current=id;$('chatTitle').textContent=name;await loadMessages()}async function loadMessages(){if(!current)return;let d=await api('/messages/'+current);$('messages').innerHTML=d.messages.map(m=>`<div class="bubble ${Number(m.sender_id)===Number(me.id)?'mine':''}"><div>${esc(m.body)}</div>${m.attachment_data?`<p><a download="${esc(m.attachment_name)}" href="${m.attachment_data}">${esc(m.attachment_name||'Pièce jointe')}</a></p>`:''}<small class="muted">${new Date(m.created_at).toLocaleString()}</small></div>`).join('');$('messages').scrollTop=$('messages').scrollHeight}
$('sendForm').onsubmit=async e=>{e.preventDefault();if(!current)return msg('Choisissez un membre.');let body=$('messageBody').value.trim(),f=$('file').files[0],attachment=null;if(f){if(f.size>7*1024*1024)return msg('Fichier trop volumineux (7 Mo maximum).');attachment={name:f.name,data:await new Promise((ok,no)=>{let r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(f)})}}try{await api('/messages',{method:'POST',body:JSON.stringify({recipient_id:Number(current),body,attachment})});$('messageBody').value='';$('file').value='';await loadMessages()}catch(e){msg(e.message)}};
async function loadPosts(){let d=await api('/social/posts');$('posts').innerHTML=d.posts.map(p=>`<article class="card"><b>${esc(p.author_name)}</b><p>${esc(p.body)}</p>${p.media_url?`<p><a href="${esc(p.media_url)}" target="_blank" rel="noopener">Voir le média</a></p>`:''}<div class="muted">${new Date(p.created_at).toLocaleString()} · ${p.reactions_count} réactions · ${p.comments_count} commentaires</div><div class="row"><button class="btn" onclick="react(${p.id})">👍 J’aime</button><button class="btn" onclick="commentPost(${p.id})">Commenter</button></div><div id="comments-${p.id}"></div></article>`).join('')||'<div class="card">Aucune publication pour le moment.</div>'}
$('publish').onclick=async()=>{try{await api('/social/posts',{method:'POST',body:JSON.stringify({body:$('postBody').value,media_url:$('postMedia').value})});$('postBody').value='';$('postMedia').value='';await loadPosts();msg('Publication publiée.')}catch(e){msg(e.message)}};
window.react=async id=>{try{await api(`/social/posts/${id}/react`,{method:'POST',body:JSON.stringify({reaction:'like'})});await loadPosts()}catch(e){msg(e.message)}};window.commentPost=async id=>{let body=prompt('Votre commentaire :');if(!body)return;try{await api(`/social/posts/${id}/comments`,{method:'POST',body:JSON.stringify({body})});await loadPosts()}catch(e){msg(e.message)}};
async function loadGroups(){let d=await api('/social/groups');$('groupList').innerHTML=d.groups.map(g=>`<div class="card"><b>${esc(g.name)}</b> <span class="muted">${g.visibility} · ${g.members_count} membres</span><p>${esc(g.description)}</p>${g.joined?'Vous êtes membre':`<button class="btn" onclick="joinGroup(${g.id})">Rejoindre</button>`}</div>`).join('')||'<div class="card">Aucun groupe pour le moment.</div>'}
$('createGroup').onclick=async()=>{try{await api('/social/groups',{method:'POST',body:JSON.stringify({name:$('groupName').value,description:$('groupDesc').value,visibility:$('groupVisibility').value})});$('groupName').value='';$('groupDesc').value='';await loadGroups();msg('Groupe créé.')}catch(e){msg(e.message)}};window.joinGroup=async id=>{try{await api(`/social/groups/${id}/join`,{method:'POST',body:'{}'});await loadGroups()}catch(e){msg(e.message)}};
async function loadNotifications(){let d=await api('/notifications');let unread=d.notifications.filter(n=>!n.read_at).length;$('unread').textContent=unread?`(${unread})`:'';$('notifications').innerHTML=d.notifications.map(n=>`<div class="item"><b>${esc(n.title)}</b><p>${esc(n.body)}</p><small class="muted">${new Date(n.created_at).toLocaleString()} ${n.read_at?'· Lu':'· Non lu'}</small>${!n.read_at?` <button class="btn" onclick="readNotification(${n.id})">Marquer lu</button>`:''}</div>`).join('')||'Aucune notification.'}
window.readNotification=async id=>{try{await api(`/notifications/${id}/read`,{method:'PATCH',body:'{}'});await loadNotifications()}catch(e){msg(e.message)}};$('readAll').onclick=async()=>{try{await api('/notifications/read-all',{method:'POST',body:'{}'});await loadNotifications()}catch(e){msg(e.message)}};init();setInterval(()=>{if(current)loadMessages().catch(()=>{});loadNotifications().catch(()=>{})},15000);
</script></body></html>
